[package]
name = "teamy-tts-ipc"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Bounded local protocol and Windows transport for Teamy TTS"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes",
  "Win32_System_RemoteDesktop", "Win32_System_Threading",
] }
